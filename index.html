<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>世界の芸術ランダムギャラリー</title>
  <style>
    body {
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      background-color: #f4f1ea;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
    }
    .card {
      background: #fff;
      max-width: 600px;
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      overflow: hidden;
      text-align: center;
      padding-bottom: 25px;
    }
    .image-box {
      width: 100%;
      height: 300px;
      background-color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .image-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .audio-box {
      padding: 18px 25px 5px;
      display: none;
    }
    .audio-label {
      font-size: 12px;
      color: #8c6d46;
      font-weight: bold;
      margin-bottom: 6px;
      display: block;
    }
    .audio-box audio {
      width: 100%;
      height: 44px;
      outline: none;
    }
    .content {
      padding: 20px 25px 10px;
    }
    .category {
      display: inline-block;
      background-color: #8c6d46;
      color: #fff;
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 22px;
      margin: 5px 0 12px;
      color: #1a1a1a;
    }
    p {
      font-size: 14px;
      line-height: 1.7;
      text-align: left;
      color: #444;
      margin-bottom: 20px;
    }
    .next-btn {
      background-color: #2c3e50;
      color: #fff;
      border: none;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
    }
    .wiki-link {
      display: block;
      margin-top: 15px;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="image-box">
    <img id="art-image" referrerpolicy="no-referrer" src="" alt="芸術作品の画像">
  </div>

  <!-- Wikimedia公式APIから取得する本物の音源プレイヤー -->
  <div class="audio-box" id="audio-box">
    <span class="audio-label" id="audio-label">♪ 実際の演奏音源を探しています...</span>
    <audio id="art-audio" controls preload="metadata"></audio>
  </div>

  <div class="content">
    <span id="art-category" class="category">読み込み中...</span>
    <h1 id="art-title">タイトル</h1>
    <p id="art-desc">解説文を読み込んでいます...</p>
    <button class="next-btn" onclick="showRandomArt()">次の芸術に出会う</button>
    <a id="art-link" class="wiki-link" href="#" target="_blank">Wikipediaで詳しく読む</a>
  </div>
</div>

<script>
  const artList = [
    { 
      title: "交響曲第9番 (ベートーヴェン)", 
      en: "Symphony_No._9_(Beethoven)", 
      category: "音楽・ドイツ",
      audioQuery: "Beethoven Symphony 9"
    },
    { 
      title: "四季 (ヴィヴァルディ)", 
      en: "The_Four_Seasons_(Vivaldi)", 
      category: "音楽・イタリア",
      audioQuery: "Vivaldi Four Seasons"
    },
    { 
      title: "ガムラン", 
      en: "Gamelan", 
      category: "音楽・インドネシア",
      audioQuery: "Gamelan"
    },
    { 
      title: "シタール", 
      en: "Sitar", 
      category: "音楽・インド",
      audioQuery: "Sitar"
    },
    { title: "モナ・リザ", en: "Mona_Lisa", category: "絵画・イタリア" },
    { title: "富嶽三十六景", en: "Thirty-six_Views_of_Mount_Fuji", category: "浮世絵・日本" },
    { title: "ミロのヴィーナス", en: "Venus_de_Milo", category: "彫刻・ギリシャ" },
    { title: "着物", en: "Kimono", category: "服飾・日本" }
  ];

  let lastIndex = -1;

  async function fetchWikiData(lang, title) {
    const url = `https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`;
    const response = await fetch(url);
    if (!response.ok) return null;
    return await response.json();
  }

  async function fetchRealAudio(query) {
    const apiUrl = `https://wikimedia.org{encodeURIComponent(query)}&gsrnamespace=6&gsrlimit=5&prop=imageinfo&iiprop=url&format=json&origin=*`;
    const response = await fetch(apiUrl);
    if (!response.ok) return null;
    const data = await response.json();
    if (!data.query || !data.query.pages) return null;
    
    const pages = Object.values(data.query.pages);
    for (const page of pages) {
      const info = Array.isArray(page.imageinfo) ? page.imageinfo.at(0) : null;
      if (info && info.url) {
        return info.url;
      }
    }
    return null;
  }

  async function showRandomArt() {
    let randomIndex;
    do {
      randomIndex = Math.floor(Math.random() * artList.length);
    } while (randomIndex === lastIndex && artList.length > 1);
    lastIndex = randomIndex;

    const selected = artList.at(randomIndex);
    const imgEl = document.getElementById("art-image");
    const audioBox = document.getElementById("audio-box");
    const audioEl = document.getElementById("art-audio");
    const audioLabel = document.getElementById("audio-label");

    audioEl.pause();
    audioEl.removeAttribute("src");
    audioEl.load();
    audioBox.style.display = "none";

    document.getElementById("art-category").textContent = selected.category;
    document.getElementById("art-title").textContent = selected.title;
    document.getElementById("art-desc").textContent = "Wikipediaから解説と画像を取得中...";
    imgEl.style.display = "none";

    if (selected.audioQuery) {
      audioBox.style.display = "block";
      audioLabel.textContent = "♪ 本物の演奏音源を読み込み中...";
      fetchRealAudio(selected.audioQuery).then(audioUrl => {
        if (audioUrl) {
          audioEl.src = audioUrl;
          audioLabel.textContent = "♪ 実際の演奏・楽器の録音（▶を押して再生）";
        } else {
          audioLabel.textContent = "※音源データが見つかりませんでした";
        }
      }).catch(() => {
        audioLabel.textContent = "※通信エラーで音源を取得できませんでした";
      });
    }

    try {
      const jaData = await fetchWikiData("ja", selected.title);
      if (jaData) {
        document.getElementById("art-desc").textContent = jaData.extract || "解説が見つかりませんでした。";
        document.getElementById("art-link").href = jaData.content_urls?.desktop?.page || "#";
      }

      let imageUrl = jaData?.thumbnail?.source || jaData?.originalimage?.source;
      if (!imageUrl && selected.en) {
        const enData = await fetchWikiData("en", selected.en);
        imageUrl = enData?.thumbnail?.source || enData?.originalimage?.source;
      }
      if (imageUrl) {
        imgEl.src = imageUrl;
        imgEl.style.display = "block";
      } else {
        imgEl.src = "https://placehold.jp";
        imgEl.style.display = "block";
      }
    } catch (error) {
      document.getElementById("art-desc").textContent = "データの取得に失敗しました。";
    }
  }

  showRandomArt();
</script>

</body>
</html>
