<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>世界の芸術ランダムギャラリー</title>
  <style>
    body {
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      background-color: #f4f1ea;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
    }
    .card {
      background: #fff;
      max-width: 600px;
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      overflow: hidden;
      text-align: center;
      padding-bottom: 25px;
    }
    .image-box {
      width: 100%;
      height: 300px;
      background-color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .image-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .audio-box {
      padding: 18px 25px 5px;
      display: none;
    }
    .audio-label {
      font-size: 12px;
      color: #8c6d46;
      font-weight: bold;
      margin-bottom: 6px;
      display: block;
    }
    .audio-box audio {
      width: 100%;
      height: 44px;
      outline: none;
    }
    .content {
      padding: 20px 25px 10px;
    }
    .category {
      display: inline-block;
      background-color: #8c6d46;
      color: #fff;
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 22px;
      margin: 5px 0 12px;
      color: #1a1a1a;
    }
    p {
      font-size: 14px;
      line-height: 1.7;
      text-align: left;
      color: #444;
      margin-bottom: 20px;
    }
    .next-btn {
      background-color: #2c3e50;
      color: #fff;
      border: none;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
    }
    .wiki-link {
      display: block;
      margin-top: 15px;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="image-box">
    <img id="art-image" referrerpolicy="no-referrer" src="" alt="芸術作品の画像">
  </div>

  <!-- 音源がある場合のみ自動で表示されるプレイヤー -->
  <div class="audio-box" id="audio-box">
    <span class="audio-label" id="audio-label">♪ 実際の演奏音源を探しています...</span>
    <audio id="art-audio" controls preload="metadata"></audio>
  </div>

  <div class="content">
    <span id="art-category" class="category">読み込み中...</span>
    <h1 id="art-title">タイトル</h1>
    <p id="art-desc">解説文を読み込んでいます...</p>
    <button class="next-btn" onclick="showRandomArt()">次の芸術に出会う</button>
    <a id="art-link" class="wiki-link" href="#" target="_blank">Wikipediaで詳しく読む</a>
  </div>
</div>

<script>
  const artList = [
    // --- 現代アート・新進気鋭の芸術家 ---
    { title: "チームラボ", en: "TeamLab_(art_collective)", category: "デジタルアート・日本" },
    { title: "オラファー・エリアソン", en: "Olafur_Eliasson", category: "現代美術・デンマーク" },
    { title: "バンクシー", en: "Banksy", category: "ストリートアート・イギリス" },
    { title: "草間彌生", en: "Yayoi_Kusama", category: "現代美術・日本" },
    { title: "塩田千春", en: "Chiharu_Shiota", category: "インスタレーション・日本" },
    { title: "ジェフ・クーンズ", en: "Jeff_Koons", category: "現代彫刻・アメリカ" },
    { title: "艾未未", en: "Ai_Weiwei", category: "現代美術・中国" },

    // --- 現代で評価されている音楽・作曲家 ---
    { title: "ブライアン・イーノ", en: "Brian_Eno", category: "アンビエント音楽・イギリス", hasAudio: true },
    { title: "坂本龍一", en: "Ryuichi_Sakamoto", category: "現代音楽 / 電子音楽・日本", hasAudio: true },
    { title: "フィリップ・グラス", en: "Philip_Glass", category: "ミニマル音楽・アメリカ", hasAudio: true },
    { title: "マックス・リヒター", en: "Max_Richter", category: "ポスト・クラシカル・ドイツ", hasAudio: true },
    { title: "ビョーク", en: "Björk", category: "前衛ポップ / 電子音楽・アイスランド", hasAudio: true },
    { title: "ジョン・ケージ", en: "John_Cage", category: "現代音楽・アメリカ", hasAudio: true },

    // --- 古典・伝統芸術・民族音楽 ---
    { title: "交響曲第9番 (ベートーヴェン)", en: "Symphony_No._9_(Beethoven)", category: "古典音楽・ドイツ", hasAudio: true },
    { title: "四季 (ヴィヴァルディ)", en: "The_Four_Seasons_(Vivaldi)", category: "古典音楽・イタリア", hasAudio: true },
    { title: "ガムラン", en: "Gamelan", category: "民族音楽・インドネシア", hasAudio: true },
    { title: "シタール", en: "Sitar", category: "民族音楽・インド", hasAudio: true },
    { title: "モナ・リザ", en: "Mona_Lisa", category: "古典絵画・イタリア" },
    { title: "富嶽三十六景", en: "Thirty-six_Views_of_Mount_Fuji", category: "浮世絵・日本" },
    { title: "ミロのヴィーナス", en: "Venus_de_Milo", category: "古代彫刻・ギリシャ" },
    { title: "着物", en: "Kimono", category: "伝統服飾・日本" }
  ];

  let lastIndex = -1;

  async function fetchWikiData(lang, title) {
    const url = `https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`;
    const response = await fetch(url);
    if (!response.ok) return null;
    return await response.json();
  }

  async function fetchWikiMediaAudio(enTitle) {
    const url = `https://wikipedia.org{encodeURIComponent(enTitle)}`;
    const response = await fetch(url);
    if (!response.ok) return null;
    const data = await response.json();
    if (!data.items || !Array.isArray(data.items)) return null;

    for (const item of data.items) {
      if (item.type === "audio" && item.srcset && item.srcset.length > 0) {
        let src = item.srcset.at(0).src;
        if (src.startsWith("//")) {
          src = "https:" + src;
        }
        return src;
      }
    }
    return null;
  }

  async function showRandomArt() {
    let randomIndex;
    do {
      randomIndex = Math.floor(Math.random() * artList.length);
    } while (randomIndex === lastIndex && artList.length > 1);
    lastIndex = randomIndex;

    const selected = artList.at(randomIndex);
    const imgEl = document.getElementById("art-image");
    const audioBox = document.getElementById("audio-box");
    const audioEl = document.getElementById("art-audio");
    const audioLabel = document.getElementById("audio-label");

    audioEl.pause();
    audioEl.removeAttribute("src");
    audioEl.load();
    audioBox.style.display = "none";

    document.getElementById("art-category").textContent = selected.category;
    document.getElementById("art-title").textContent = selected.title;
    document.getElementById("art-desc").textContent = "Wikipediaから解説と画像を取得中...";
    imgEl.style.display = "none";

    // 音楽ジャンルの場合、Wikipediaに音源データがあるか確認して自動表示
    if (selected.hasAudio && selected.en) {
      fetchWikiMediaAudio(selected.en).then(audioUrl => {
        if (audioUrl) {
          audioEl.src = audioUrl;
          audioBox.style.display = "block";
          audioLabel.textContent = "♪ 関連音声・演奏の録音（▶を押して再生）";
        } else {
          audioBox.style.display = "none";
        }
      }).catch(() => {
        audioBox.style.display = "none";
      });
    }

    try {
      const jaData = await fetchWikiData("ja", selected.title);
      if (jaData) {
        document.getElementById("art-desc").textContent = jaData.extract || "解説が見つかりませんでした。";
        document.getElementById("art-link").href = jaData.content_urls?.desktop?.page || "#";
      }

      let imageUrl = jaData?.thumbnail?.source || jaData?.originalimage?.source;
      if (!imageUrl && selected.en) {
        const enData = await fetchWikiData("en", selected.en);
        imageUrl = enData?.thumbnail?.source || enData?.originalimage?.source;
      }
      if (imageUrl) {
        imgEl.src = imageUrl;
        imgEl.style.display = "block";
      } else {
        imgEl.src = "https://placehold.jp";
        imgEl.style.display = "block";
      }
    } catch (error) {
      document.getElementById("art-desc").textContent = "データの取得に失敗しました。";
    }
  }

  showRandomArt();
</script>

</body>
</html>
