<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>世界の芸術ランダムギャラリー</title>
  <style>
    body {
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      background-color: #f4f1ea;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
    }
    .card {
      background: #fff;
      max-width: 600px;
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      overflow: hidden;
      text-align: center;
      padding-bottom: 25px;
    }
    .image-box {
      width: 100%;
      height: 300px;
      background-color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .image-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .music-player {
      padding: 15px 25px 0;
      display: none;
    }
    .play-btn {
      background-color: #8c6d46;
      color: #fff;
      border: none;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
    }
    .content {
      padding: 20px 25px 10px;
    }
    .category {
      display: inline-block;
      background-color: #8c6d46;
      color: #fff;
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 22px;
      margin: 5px 0 12px;
      color: #1a1a1a;
    }
    p {
      font-size: 14px;
      line-height: 1.7;
      text-align: left;
      color: #444;
      margin-bottom: 20px;
    }
    .next-btn {
      background-color: #2c3e50;
      color: #fff;
      border: none;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
    }
    .wiki-link {
      display: block;
      margin-top: 15px;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="image-box">
    <img id="art-image" referrerpolicy="no-referrer" src="" alt="芸術作品の画像">
  </div>

  <!-- 内蔵音源プレイヤー -->
  <div class="music-player" id="music-player">
    <button class="play-btn" id="play-btn" onclick="toggleMelody()">▶ メロディを再生する</button>
  </div>

  <div class="content">
    <span id="art-category" class="category">読み込み中...</span>
    <h1 id="art-title">タイトル</h1>
    <p id="art-desc">解説文を読み込んでいます...</p>
    <button class="next-btn" onclick="showRandomArt()">次の芸術に出会う</button>
    <a id="art-link" class="wiki-link" href="#" target="_blank">Wikipediaで詳しく読む</a>
  </div>
</div>

<script>
  const artList = [
    { title: "モナ・リザ", en: "Mona_Lisa", category: "絵画・イタリア" },
    { title: "富嶽三十六景", en: "Thirty-six_Views_of_Mount_Fuji", category: "浮世絵・日本" },
    { title: "ミロのヴィーナス", en: "Venus_de_Milo", category: "彫刻・ギリシャ" },
    { 
      title: "交響曲第9番 (ベートーヴェン)", 
      en: "Symphony_No._9_(Beethoven)", 
      category: "音楽・ドイツ",
      melody: [
        [329.63, 0.4], [329.63, 0.4], [349.23, 0.4], [392.00, 0.4],
        [392.00, 0.4], [349.23, 0.4], [329.63, 0.4], [293.66, 0.4],
        [261.63, 0.4], [261.63, 0.4], [293.66, 0.4], [329.63, 0.4],
        [329.63, 0.6], [293.66, 0.2], [293.66, 0.8]
      ]
    },
    { 
      title: "ガムラン", 
      en: "Gamelan", 
      category: "音楽・インドネシア",
      melody: [
        [261.63, 0.3], [293.66, 0.3], [329.63, 0.3], [392.00, 0.3],
        [440.00, 0.3], [523.25, 0.4], [440.00, 0.3], [392.00, 0.3],
        [329.63, 0.3], [293.66, 0.3], [261.63, 0.6]
      ]
    },
    { 
      title: "さくらさくら", 
      en: "Sakura_Sakura", 
      category: "伝統音楽・日本",
      melody: [
        [440.00, 0.4], [440.00, 0.4], [493.88, 0.8],
        [440.00, 0.4], [440.00, 0.4], [493.88, 0.8],
        [440.00, 0.4], [493.88, 0.4], [523.25, 0.4], [493.88, 0.4],
        [440.00, 0.4], [493.88, 0.2], [440.00, 0.2], [349.23, 0.8]
      ]
    },
    { title: "着物", en: "Kimono", category: "服飾・日本" },
    { title: "真珠の耳飾りの少女", en: "Girl_with_a_Pearl_Earring", category: "絵画・オランダ" }
  ];

  let lastIndex = -1;
  let audioCtx = null;
  let isPlaying = false;
  let playTimers = [];
  let currentMelody = null;

  function stopMelody() {
    isPlaying = false;
    playTimers.forEach(timer => clearTimeout(timer));
    playTimers = [];
    document.getElementById("play-btn").textContent = "▶ メロディを再生する";
  }

  function toggleMelody() {
    if (isPlaying) {
      stopMelody();
      return;
    }
    if (!currentMelody) return;

    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }

    isPlaying = true;
    document.getElementById("play-btn").textContent = "■ 停止する";

    let currentTime = 0;
    currentMelody.forEach(([freq, duration]) => {
      const timer = setTimeout(() => {
        if (!isPlaying) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      }, currentTime * 1000);
      playTimers.push(timer);
      currentTime += duration;
    });

    const endTimer = setTimeout(() => {
      stopMelody();
    }, currentTime * 1000);
    playTimers.push(endTimer);
  }

  async function fetchWikiData(lang, title) {
    const url = `https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`;
    const response = await fetch(url);
    if (!response.ok) return null;
    return await response.json();
  }

  async function showRandomArt() {
    stopMelody();

    let randomIndex;
    do {
      randomIndex = Math.floor(Math.random() * artList.length);
    } while (randomIndex === lastIndex && artList.length > 1);
    lastIndex = randomIndex;

    const selected = artList[randomIndex];
    const imgEl = document.getElementById("art-image");
    const musicPlayer = document.getElementById("music-player");

    document.getElementById("art-category").textContent = selected.category;
    document.getElementById("art-title").textContent = selected.title;
    document.getElementById("art-desc").textContent = "Wikipediaから解説と画像を取得中...";
    imgEl.style.display = "none";

    if (selected.melody) {
      currentMelody = selected.melody;
      musicPlayer.style.display = "block";
    } else {
      currentMelody = null;
      musicPlayer.style.display = "none";
    }

    try {
      const jaData = await fetchWikiData("ja", selected.title);
      if (jaData) {
        document.getElementById("art-desc").textContent = jaData.extract || "解説が見つかりませんでした。";
        document.getElementById("art-link").href = jaData.content_urls?.desktop?.page || "#";
      }

      let imageUrl = jaData?.thumbnail?.source || jaData?.originalimage?.source;
      if (!imageUrl && selected.en) {
        const enData = await fetchWikiData("en", selected.en);
        imageUrl = enData?.thumbnail?.source || enData?.originalimage?.source;
      }
      if (imageUrl) {
        imgEl.src = imageUrl;
        imgEl.style.display = "block";
      } else {
        imgEl.src = "https://placehold.jp";
        imgEl.style.display = "block";
      }
    } catch (error) {
      document.getElementById("art-desc").textContent = "データの取得に失敗しました。";
    }
  }

  showRandomArt();
</script>

</body>
</html>
